{% extends "base.html" %}

{% block content %}

<section class="dashboard">

    <header class="dashboard-header">
        <h1>Dashboard</h1>
        <p>Overview of your Mercedes vehicle service management system.</p>
    </header>

    <section class="dashboard-stats">

        <article class="stat-card">
            <h2>Total Vehicles</h2>
            <p>{{ total_vehicles }}</p>
        </article>

        <article class="stat-card">
            <h2>Total Service Records</h2>
            <p>{{ total_service_records }}</p>
        </article>

        <article class="stat-card">
            <h2>Vehicles Needing Service</h2>
            <p>{{ vehicles_needing_service }}</p>
        </article>

    </section>

</section>

{% endblock %}
