{% extends "base.html" %}
{% block content %}

<section class="service-create">

    <header class="service-create-header">
        <span class="service-create-label">NEW SERVICE RECORD</span>
        <h1>Add Service Record</h1>
        <p class="service-create-vehicle">
            {{ vehicle.make }} {{ vehicle.model }}
            <span>{{ vehicle.year }}</span>
        </p>
    </header>

    <form method="POST">
        {% if error %}
        <p class="form-error">
            {{ error }}
        </p>
        {% endif %}
        <div class="service-create-form">

            <div class="form-field">
                <label for="service_type">Service Type</label>
                <input type="text" id="service_type" name="service_type" required>
            </div>

            <div class="form-field">
                <label for="service_date">Service Date</label>
                <input type="text" id="service_date" name="service_date" placeholder="DD-MM-YYYY" maxlength="10"
                    required>
            </div>

            <div class="form-field">
                <label for="mileage">Mileage</label>
                <input type="number" id="mileage" name="mileage" required>
            </div>

            <div class="form-field">
                <label for="cost">Cost (£)</label>
                <input type="number" id="cost" name="cost" step="0.01" required>
            </div>

            <div class="form-field">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="Scheduled">Scheduled</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>

            <div class="form-field form-field-full">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes"></textarea>
            </div>
        </div>

        <div class="service-create-actions">

            <button type="submit" class="create-service-button">
                Create Service Record
            </button>

            <a href="/vehicles/{{ vehicle.id }}" class="cancel-service-button">
                Cancel
            </a>

        </div>

    </form>
</section>

{% endblock %}
