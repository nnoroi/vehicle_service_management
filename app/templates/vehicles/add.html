{% extends "base.html" %}

{% block content %}

<section class="vehicle-form">
    
    <header class="page-header">
        <h1>Add vehicle</h1>
        <p>Add a Mercedes vehicle to your service managament system</p>
    </header>

    <form method="POST">
        
        <div class="form-group">
            <label for="make">Make</label>
            <input
            type="text"
            id="make"
            name ="make"
            value="Mercedes-Benz"
            required>
        </div>

        <div class="form-group">
            <label for="model">Model</label>
            <input
            type="text"
            id="model"
            name="model"
            required>
        </div>

        <div class="form-group">
            <label for="year">Year</label>
            <input
            type="number"
            id="year"
            name ="year"
            required>
        </div>


        <div class="form-group">
            <label for="registration">Registration</label>
            <input
            type="text"
            id="registration"
            name ="registration"
            required>
        </div>

        <div class="form-group">
            <label for="vin">VIN</label>
            <input
                type="text"
                id="vin"
                name="vin"
                required
            >
        </div>

        <div class="form-group">
            <label for="mileage">Mileage</label>
            <input
                type="number"
                id="mileage"
                name="mileage"
                min="0"
                value="0"
                required
            >
        </div>

        <div class="form-group">
            <label for="fuel_type">Fuel Type</label>
            <select id="fuel_type" name="fuel_type" required>
                <option value="">Select fuel type</option>
                <option value="Petrol">Petrol</option>
                <option value="Diesel">Diesel</option>
                <option value="Hybrid">Hybrid</option>
                <option value="Electric">Electric</option>
            </select>
        </div>

         <button type="submit">
            Add Vehicle
        </button>

    </form>

    <a href="/vehicles">
        Back to Vehicles
    </a>

</section>
{% endblock %}
