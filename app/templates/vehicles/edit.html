{% extends "base.html" %}
{% block content %}

<section class="vehicle-form">

    <header class="page-header">
        <h1>Edit Vehicle</h1>
        <p>Update the details of your Mercedes vehicle</p>
    </header>

    <form method="POST">
        {% if error %}

            <div class="form-error">
                {{ error }}
            </div>

        {% endif %}

        <div class="form-group">
            <label for="make">Make</label>
            <input
                type="text"
                id="make"
                name="make"
                value="{{ vehicle.make }}"
                required>
        </div>

        <div class="form-group">
            <label for="model">Model</label>
            <input
                type="text"
                id="model"
                name="model"
                value="{{ vehicle.model }}"
                required>
        </div>

        <div class="form-group">
            <label for="year">Year</label>
            <input
                type="number"
                id="year"
                name="year"
                value="{{ vehicle.year }}"
                required>
        </div>

        <div class="form-group">
            <label for="registration">Registration</label>
            <input
                type="text"
                id="registration"
                name="registration"
                value="{{ vehicle.registration }}"
                required>
        </div>

        <div class="form-group">
            <label for="vin">VIN</label>
            <input
                type="text"
                id="vin"
                name="vin"
                value="{{ vehicle.vin }}"
                required>
        </div>

        <div class="form-group">
            <label for="mileage">Mileage</label>
            <input
                type="number"
                id="mileage"
                name="mileage"
                min="0"
                value="{{ vehicle.mileage }}"
                required>
        </div>

        <div class="form-group">
            <label for="fuel_type">Fuel Type</label>
            <select id="fuel_type" name="fuel_type" required>

                <option value="">Select fuel type</option>

                <option value="Petrol"
                    {% if vehicle.fuel_type == "Petrol" %}selected{% endif %}>
                    Petrol
                </option>

                <option value="Diesel"
                    {% if vehicle.fuel_type == "Diesel" %}selected{% endif %}>
                    Diesel
                </option>

                <option value="Hybrid"
                    {% if vehicle.fuel_type == "Hybrid" %}selected{% endif %}>
                    Hybrid
                </option>

                <option value="Electric"
                    {% if vehicle.fuel_type == "Electric" %}selected{% endif %}>
                    Electric
                </option>

            </select>
        </div>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <a href="/vehicles/{{ vehicle.id }}">
        Cancel
    </a>

</section>

{% endblock %}
        </div>
    </form>
</section>
